<style>
:root{--tq:#009BA8;--ltq:#61C2CB;--gr:#94C021;--lgr:#C3D984;--or:#EE7D22;--rd:#E61149;--ink:#1f2b33;--pap:#fbf5e6;--pap2:#f1e6c8;--line:#e0cfa4;--gold:#ffd24a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#071214;overflow:hidden;font-family:'Nunito',system-ui,sans-serif;color:var(--ink)}
#wrap{position:fixed;inset:0;display:grid;place-items:center}
#game{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;max-height:100vh;background:#000;overflow:hidden;container-type:inline-size}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:auto}
.kbd{display:inline-block;min-width:1.6em;padding:0 .4em;border-radius:5px;background:#fff;color:var(--ink);border:1px solid #bbb;border-bottom-width:3px;font-weight:800;font-size:.85em;text-align:center;line-height:1.5}
/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s}
#hud.on{opacity:1}
.bars{position:absolute;left:1.6cqw;top:1.6cqw;width:24cqw}
.bar{height:1.5cqw;background:rgba(0,0,0,.55);border-radius:1cqw;overflow:hidden;border:2px solid rgba(255,255,255,.25)}
#hpf{height:100%;width:100%;background:linear-gradient(90deg,#94C021,#C3D984);transition:width .2s}
#hpf.low{background:linear-gradient(90deg,#E61149,#ff6b7f)}
.bar.st{height:.7cqw;margin-top:.5cqw;border-width:1px}
#stf{height:100%;width:100%;background:#61C2CB}
#zone{color:#fff;font-family:'Cinzel',serif;font-weight:800;font-size:1.3cqw;margin-top:.6cqw;text-shadow:0 2px 3px #000;letter-spacing:.06em}
#obj{position:absolute;left:50%;top:1.4cqw;transform:translateX(-50%);max-width:46cqw;background:rgba(10,25,28,.82);color:#fff;border-radius:1cqw;padding:.7cqw 1.4cqw;text-align:center;border:2px solid rgba(255,210,74,.6);font-size:1.45cqw}

.rt{position:absolute;right:1.4cqw;top:1.4cqw;display:flex;flex-direction:column;align-items:flex-end;gap:.6cqw;pointer-events:auto}
#mm{width:18cqw;height:auto;border-radius:1cqw;border:2px solid rgba(255,255,255,.4);background:#0b1a1d;box-shadow:0 4px 12px rgba(0,0,0,.4)}

#prompt{position:absolute;left:50%;bottom:4cqw;transform:translateX(-50%) translateY(10px);background:rgba(10,25,28,.85);color:#fff;padding:.6cqw 1.2cqw;border-radius:1cqw;font-weight:800;font-size:1.4cqw;opacity:0;transition:.2s}
#prompt.on{opacity:1;transform:translateX(-50%)}
#hidden{position:absolute;left:1.6cqw;top:7cqw;background:rgba(31,58,64,.9);color:var(--ltq);padding:.3cqw .9cqw;border-radius:1cqw;font-weight:800;font-size:1.1cqw;opacity:0;transition:.2s}

.toast svg{width:1.5cqw;height:1.5cqw}
/* dialoog */
#dlg{position:absolute;left:50%;bottom:2cqw;transform:translateX(-50%) translateY(150%);opacity:0;pointer-events:none;width:min(76cqw,920px);background:var(--pap);border:3px solid var(--line);border-radius:1.4cqw;padding:1.2cqw 1.4cqw;display:flex;gap:1.2cqw;align-items:flex-start;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:transform .25s;z-index:30;flex-wrap:wrap}

#dlg .dn{font-family:'Cinzel',serif;font-weight:800;color:var(--tq);font-size:1.5cqw}
#dlg .dx{font-size:1.55cqw;line-height:1.45}
#dlg .dnext{align-self:flex-end}
#dlg .dq{width:100%;font-weight:800;font-size:1.6cqw}
#dlg .dch{display:grid;gap:.6cqw;width:100%}
/* knoppen */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;padding:.6em 1.1em;border:0;border-radius:.7em;background:var(--tq);color:#fff;font:inherit;font-weight:800;font-size:clamp(13px,1.35cqw,17px);cursor:pointer;box-shadow:0 4px 0 #00717b;text-align:left}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #00717b}
.btn.v{background:var(--or);box-shadow:0 4px 0 #b55a12}

.btn .kbd{font-size:.75em}

.sp-b{background:var(--tq)}.sp-r{background:var(--gr)}.sp-v{background:var(--or)}.sp-o{background:#7a5aa8}

.ov{position:absolute;inset:0;background:rgba(5,15,18,.72);display:none;align-items:center;justify-content:center;z-index:35;padding:2cqw}

.opts{display:grid;gap:.5em}

#qnext{margin-top:.8em}
.small{font-size:.88em;opacity:.85}
.slist{list-style:none;padding:0;margin:.4em 0;display:grid;gap:.45em}

.sitem.good{border-color:var(--gr);background:#f3f9e6}.sitem.wrong{border-color:var(--rd);background:#fdf0f3}
.sitem .num{flex:none;width:1.8em;height:1.8em;border-radius:50%;background:var(--tq);color:#fff;display:grid;place-items:center;font-weight:800}
.sitem .stxt{flex:1;font-weight:700}
.arrows{display:flex;flex-direction:column;gap:2px}
.ar{border:0;background:var(--pap2);border-radius:.5em;width:2.2em;height:1.7em;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.ar:hover:not(:disabled){background:var(--ltq);color:#fff}.ar:disabled{opacity:.3}
.cats{display:grid;gap:.45em}
.crow{display:flex;align-items:center;gap:.6em;flex-wrap:wrap;background:#fff;border:2px solid #dccb9f;border-radius:.8em;padding:.45em .7em}
.crow.good{border-color:var(--gr);background:#f3f9e6}.crow.wrong{border-color:var(--rd);background:#fdf0f3}
.ctxt{flex:1;min-width:14em;font-weight:700}
.cbtns{display:flex;gap:.3em;flex-wrap:wrap}
.cb{border:2px solid var(--c);color:var(--c);background:#fff;border-radius:.6em;padding:.25em .6em;font:inherit;font-size:.88em;font-weight:800;cursor:pointer}

textarea{width:100%;font:inherit;border:2px solid #dccb9f;border-radius:.8em;padding:.7em;background:#fff;resize:vertical}
.bron{margin:.3em 0 .6em;background:#fff;border:2px solid var(--line);border-radius:.8em;padding:.5em;display:inline-block;max-width:100%}
.bron .bimg{width:min(300px,100%);aspect-ratio:4/3;overflow:hidden;border-radius:.5em;background:var(--pap2);display:grid;place-items:center}
.bron .bimg img,.bron .bimg svg{width:100%;height:100%;object-fit:cover}
.bron figcaption{font-size:.78em;color:#6a5a3a;margin-top:.4em;max-width:300px;line-height:1.35}
/* filmscène */
#cut{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#16343a,#050c0e 75%);display:none;align-items:center;justify-content:center;z-index:45;padding:3cqw;color:#fff}
#cut.open{display:flex}
.cutin{max-width:62cqw;text-align:center;animation:cin .6s}
.cutin.dark{text-shadow:0 0 20px rgba(230,17,73,.4)}
@keyframes cin{from{opacity:0;filter:blur(6px)}}
.glline{height:2px;width:30cqw;margin:0 auto 1.4cqw;background:linear-gradient(90deg,transparent,var(--ltq),transparent);animation:gl 2s infinite}
@keyframes gl{50%{opacity:.3;transform:scaleX(.6)}}
.ckop{font-size:1.1cqw;letter-spacing:.3em;text-transform:uppercase;color:var(--ltq);font-weight:800}
.cjaar{font-family:'Cinzel',serif;font-size:5cqw;font-weight:900;color:var(--gold);line-height:1.1;text-shadow:0 0 30px rgba(255,210,74,.35)}
.cplaats{font-size:1.4cqw;color:#cfe;letter-spacing:.06em}
#cut h2{font-family:'Cinzel',serif;font-size:2.6cqw;margin:.6cqw 0 1cqw}
.cp{font-size:1.55cqw;line-height:1.6;color:#e9f1f1;margin-bottom:1.4cqw}
.cp .kbd{color:var(--ink)}
#cut .bron{color:var(--ink)}
/* panelen */
.panel{background:var(--pap);border:3px solid var(--line);border-radius:1.4cqw;max-width:min(76cqw,900px);width:100%;max-height:92%;overflow:auto;padding:1.8cqw 2.2cqw;font-size:clamp(13px,1.4cqw,17px);position:relative}
.logo2{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(40px,6.5cqw,90px);color:var(--tq);letter-spacing:.12em;line-height:1;text-shadow:3px 3px 0 #e9dcbc}
.sub2{font-family:'Cinzel',serif;font-weight:800;color:var(--rd);font-size:clamp(16px,2cqw,26px);margin-bottom:.6em;letter-spacing:.1em}
.sporen{display:flex;gap:.4em;align-items:center;flex-wrap:wrap;background:#fff;border-radius:.8em;padding:.5em .7em;font-size:.92em}
.form{display:grid;grid-template-columns:2fr 1fr;gap:.7em;margin-top:.8em}
.form label{display:flex;flex-direction:column;font-weight:800;font-size:.9em;gap:.2em}
.form input,.form select{font:inherit;padding:.55em .7em;border:2px solid #dccb9f;border-radius:.6em;background:#fff}
#start{background:radial-gradient(circle at 30% 20%,#1b4a50,#050c0e 80%);display:none}
#start.open{display:flex}
.rank{text-align:center;background:#fff;border-radius:1em;padding:.8em;margin:.8em 0;border:3px solid var(--tq)}
.rk{font-family:'Cinzel',serif;font-size:1.8em;font-weight:900;color:var(--tq)}
.rem{background:#fdecef;border-left:6px solid var(--rd);border-radius:.8em;padding:.6em .9em}.rem.good{background:#eef7dc;border-color:var(--gr)}
.rem ul{margin:.3em 0 0 1.1em;padding:0}
.boek{display:inline-flex;align-items:center;gap:.3em;background:var(--lgr);border-radius:.5em;padding:0 .5em;font-size:.85em;font-weight:700}
.inlever{margin-top:.8em;background:#e7f6f7;border-left:6px solid var(--tq);border-radius:.8em;padding:.6em .9em}
.inlever ol{margin:.3em 0 0 1.1em;padding:0}
#end .panel h1{font-family:'Cinzel',serif;color:var(--tq);margin:.1em 0}
.tabs{display:flex;gap:.4em;margin-bottom:.8em}
.tab{border:2px solid var(--ltq);background:#fff;color:var(--tq);border-radius:.6em;padding:.3em .9em;font:inherit;font-weight:800;cursor:pointer}.tab.on{background:var(--tq);color:#fff}
.acts{padding-left:1.2em}.acts li{margin:.2em 0;opacity:.6}.acts li.done{opacity:1;color:#4a6a10}.acts li.now{opacity:1;font-weight:800}
.bookgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.8em}
.bnr{font-weight:800;color:var(--tq)}
.ctl td{padding:.3em .6em;vertical-align:top}
#jClose{position:absolute;right:1em;top:1em}

#desync h2{font-family:'Cinzel',serif;color:var(--rd);font-size:2.4em;margin:.2em 0}
.conf{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;z-index:90;animation:fall 2.8s ease-in forwards;pointer-events:none}
@keyframes fall{to{top:105vh;transform:rotate(720deg)}}
/* aanraakbediening */
#touch{display:none;position:absolute;inset:0;pointer-events:none;z-index:20}
body.touchmode #touch{display:block}
#tpad{position:absolute;left:3cqw;bottom:3cqw;width:16cqw;height:16cqw;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);pointer-events:auto;touch-action:none}
#tknob{position:absolute;left:50%;top:50%;width:7cqw;height:7cqw;margin:-3.5cqw;border-radius:50%;background:rgba(255,255,255,.4)}
.tb{position:absolute;width:9cqw;height:9cqw;border-radius:50%;background:rgba(10,25,28,.6);border:2px solid rgba(255,255,255,.4);color:#fff;font-weight:800;font-size:1.6cqw;pointer-events:auto;touch-action:none;display:grid;place-items:center;font-family:inherit}
#tatk{right:4cqw;bottom:4cqw;background:rgba(230,17,73,.55)}#tuse{right:14cqw;bottom:9cqw;background:rgba(0,155,168,.6)}#trun{right:4cqw;bottom:15cqw;width:7cqw;height:7cqw}
@media print{#game{display:none}}

<body>
<!--
  POLIS: Schaduw van Hellas · Geschiedenis 2A · Middenschool Heilig Hart Bree
  Leerstof: leerwerkboek trimester 1, Les 4 en Les 5 (p. 29-39)
  Aanpassen? Zoek naar "CONFIG" (mailadres) en "VERHAAL, MISSIES EN VRAGEN" (teksten en vragen).
  Bronfoto's laden van Wikimedia Commons; lukt dat niet, dan toont het spel automatisch een eigen tekening.
-->
<div id="wrap"><div id="game">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="bars"><div class="bar"><div id="hpf"></div></div><div class="bar st"><div id="stf"></div></div><div id="zone"></div></div>
    <div id="hidden">Verstopt</div>
    <div id="obj"><div class="ol">Missie</div><div id="objt"></div><div id="objs"></div></div>
    <div class="rt"><canvas id="mm" width="200" height="140"></canvas>
      <div class="hrow"><span class="hb" id="drbox"><span id="drico"></span><span id="dr">0</span></span><button class="hb" id="jBtn">Dagboek <span class="kbd">Tab</span></button><button class="hb" id="sBtn" aria-label="geluid"></button><button class="hb" id="mBtn">Menu</button></div></div>
    <div id="prompt"></div>
  </div>
  <div id="toasts"></div>
  <div id="touch"><div id="tpad"><div id="tknob"></div></div><button class="tb" id="tatk">Speer</button><button class="tb" id="tuse">E</button><button class="tb" id="trun">Ren</button></div>
  <div id="dlg"></div>
  <div class="ov" id="quiz"><div class="qcard"></div></div>
  <div id="cut"></div>
  <div class="ov" id="journal"><div class="panel"><button class="btn alt" id="jClose">Sluiten</button><div class="jbody"></div></div></div>
  <div class="ov" id="desync"><div class="panel"><h2>Desynchronisatie</h2><p>Je bent gevallen. De herinnering is verstoord.<br>Glaux brengt je terug naar het begin van deze missie (-10 drachmen).</p><button class="btn" id="desyncBtn">Probeer opnieuw</button></div></div>
  <div class="ov" id="end"><div class="panel ebody"></div></div>
  <div class="ov" id="start"><div class="panel sbody"></div></div>
</div></div>
<script>
/* ===================== CONFIG ===================== */
const CONFIG = { mail: 'robin.vanhove@hhartbree.be', leerkracht: 'meneer Vanhove' };
/* ================== KERN: canvas, invoer, wiskunde, geluid ================== */
const VW = 960, VH = 540, T = 32;
let ZOOM = 1.65, zoomTarget = 1.65;
const cv = document.getElementById('cv'), cx = cv.getContext('2d');
cv.width = VW; cv.height = VH;

const keys = {}, pressed = {};
addEventListener('keydown', e => {
  if (document.activeElement && ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) return;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) pressed[e.code] = true; keys[e.code] = true;
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const tp = (...c) => c.some(k => pressed[k]);
const kd = (...c) => c.some(k => keys[k]);

/* aanraakbediening (Chromebook met touchscreen, tablet) */
const touch = { on:false, id:null, ox:0, oy:0, x:0, y:0, atk:false, use:false, run:false };
function initTouch(){
  const pad = document.getElementById('tpad'), knob = document.getElementById('tknob');
  const start = e => { const t = e.changedTouches[0]; touch.on = true; touch.id = t.identifier; const r = pad.getBoundingClientRect(); touch.ox = r.left + r.width/2; touch.oy = r.top + r.height/2; mv(e); e.preventDefault(); };
  const mv = e => { for (const t of e.changedTouches) if (t.identifier === touch.id) { let dx = t.clientX - touch.ox, dy = t.clientY - touch.oy; const d = Math.hypot(dx,dy), m = 46; if (d > m){ dx = dx/d*m; dy = dy/d*m; } touch.x = dx/m; touch.y = dy/m; knob.style.transform = `translate(${dx}px,${dy}px)`; } e.preventDefault(); };
  const end = e => { for (const t of e.changedTouches) if (t.identifier === touch.id) { touch.on = false; touch.x = touch.y = 0; knob.style.transform = ''; } };
  pad.addEventListener('touchstart', start, {passive:false}); pad.addEventListener('touchmove', mv, {passive:false}); pad.addEventListener('touchend', end); pad.addEventListener('touchcancel', end);

  fieldfire(g, o){ g.fillStyle = 'rgba(40,25,15,.5)'; g.beginPath(); g.ellipse(o.x, o.y, o.r, o.r*.7, 0, 0, 7); g.fill(); },

function drawHuman(g, e, time){
  const L = e.look, s = (L.scale||1) * (e.big||1), x = e.x, y = e.y, a = e.dir || 0;
  if (e.dead){ drawFallen(g, e); return; }
  const walk = e.moving ? Math.sin(time*14 + e.x*.1) : 0, flash = e.flash > 0;
  g.save(); g.translate(x, y); g.scale(s, s);
  g.globalAlpha = e.hidden ? .45 : 1;
  g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(2, 9, 10, 5, 0, 0, 7); g.fill();
  const fx = Math.cos(a), fy = Math.sin(a), px = -fy, py = fx;
  /* benen */
  g.strokeStyle = shade(L.skin, .85); g.lineWidth = 3.4; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-3, 3); g.lineTo(-3 + walk*2.5, 10); g.moveTo(3, 3); g.lineTo(3 - walk*2.5, 10); g.stroke();
  /* mantel */
  if (L.cape){ g.fillStyle = L.cape; g.beginPath(); g.moveTo(-8, -4); g.quadraticCurveTo(-fx*14, -fy*6 + 8, 8, -4); g.closePath(); g.fill(); }
  /* wapen achter of voor */
  const atk = e.atkT > 0 ? Math.sin((1 - e.atkT/.2)*Math.PI) : 0;
  const drawWeapon = () => {
    if (L.weapon === 'spear' || L.weapon === 'sarissa'){
      const len = L.weapon === 'sarissa' ? 64 : 30, ext = atk * (L.weapon === 'sarissa' ? 10 : 14);
      const bx = px*7 + fx*(-6+ext), by = py*7 - 2 + fy*(-6+ext);
      g.strokeStyle = '#6b4a2e'; g.lineWidth = 2.2; g.beginPath(); g.moveTo(bx, by); g.lineTo(bx + fx*len, by + fy*len); g.stroke();
      g.fillStyle = '#c9ced3'; g.beginPath(); const tx = bx + fx*len, ty = by + fy*len; g.moveTo(tx + fx*7, ty + fy*7); g.lineTo(tx + px*2.6, ty + py*2.6); g.lineTo(tx - px*2.6, ty - py*2.6); g.fill();
    } else if (L.weapon === 'bow'){ g.strokeStyle = '#6b4a2e'; g.lineWidth = 2; g.beginPath(); g.arc(fx*8, fy*8 - 2, 9, a - 1.3, a + 1.3); g.stroke(); }
  };
  if (fy < 0) drawWeapon();
  /* lichaam */
  g.fillStyle = flash ? '#ffffff' : L.tunic; g.beginPath(); g.ellipse(0, 0, 8.5, 7.5, 0, 0, 7); g.fill();
  g.fillStyle = 'rgba(0,0,0,.12)'; g.beginPath(); g.ellipse(0, 3, 8, 4, 0, 0, Math.PI); g.fill();
  if (L.sash){ g.strokeStyle = L.sash; g.lineWidth = 2.2; g.beginPath(); g.moveTo(-7, -3); g.lineTo(6, 4); g.stroke(); }
  /* schild aan de andere kant */
  if (L.shield){ const sx = -px*8 + fx*2, sy = -py*8 + fy*2 - 1; g.fillStyle = 'rgba(0,0,0,.2)'; g.beginPath(); g.arc(sx+1.5, sy+2, 8.5, 0, 7); g.fill();
    g.fillStyle = flash ? '#fff' : L.shield; g.beginPath(); g.arc(sx, sy, 8.5, 0, 7); g.fill(); g.strokeStyle = shade(L.shield, .7); g.lineWidth = 1.4; g.stroke(); emblem(g, L.emb, sx, sy); }
  /* hoofd */
  g.fillStyle = L.skin; g.beginPath(); g.arc(0, -9, 5.6, 0, 7); g.fill();
  helmet(g, L, a, fx, fy);
  if (fy > -0.2 && L.helm !== 'corinth' && L.helm !== 'hood'){ g.fillStyle = '#1f2b33'; g.fillRect(-2.6 + fx*1.5, -9.5, 1.4, 1.6); g.fillRect(1.4 + fx*1.5, -9.5, 1.4, 1.6); }
  if (fy >= 0) drawWeapon();
  g.restore();
  if (e.hpBar && e.hp < e.maxhp){ g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(x-12, y-26*s, 24, 4); g.fillStyle = e.team === 'g' ? '#94C021' : '#E61149'; g.fillRect(x-12, y-26*s, 24*Math.max(0,e.hp)/e.maxhp, 4); }
}
function helmet(g, L, a, fx, fy){
  const h = L.helm;
  if (h === 'hood'){ g.fillStyle = '#1f3a40'; g.beginPath(); g.arc(0, -9.5, 6.6, 0, 7); g.fill(); g.beginPath(); g.moveTo(-5, -10); g.lineTo(-fx*9, -9 - fy*9 - 3); g.lineTo(5, -10); g.fill(); g.fillStyle = '#d9a77c'; if (fy > -0.3){ g.beginPath(); g.ellipse(fx*2.5, -8 + fy*1.5, 3.2, 3, 0, 0, 7); g.fill(); g.fillStyle = '#1f2b33'; g.fillRect(-1.8 + fx*2.5, -8.8, 1.2, 1.4); g.fillRect(1 + fx*2.5, -8.8, 1.2, 1.4); } return; }
  if (h === 'corinth'){ g.fillStyle = '#b8862a'; g.beginPath(); g.arc(0, -9.5, 6.3, 0, 7); g.fill(); g.fillStyle = '#8a6420'; if (fy > -0.3){ g.fillRect(-3.5 + fx*2, -10, 7, 1.8); g.fillRect(-.8 + fx*2, -10, 1.6, 5); }
    if (L.crest){ g.strokeStyle = L.crest; g.lineWidth = 3.5; g.beginPath(); g.moveTo(-fx*8, -14 - fy*4); g.lineTo(fx*6, -14 + fy*3); g.stroke(); } return; }
  if (h === 'tiara'){ g.fillStyle = '#e9e1cf'; g.beginPath(); g.arc(0, -10, 6, 0, 7); g.fill(); g.fillStyle = '#c9b993'; g.beginPath(); g.moveTo(-5, -11); g.lineTo(0, -18); g.lineTo(5, -11); g.fill(); g.fillStyle = '#1a1410'; g.beginPath(); g.ellipse(0, -5, 4, 3, 0, 0, Math.PI); g.fill(); return; }
  if (h === 'phryg'){ g.fillStyle = '#c9a23a'; g.beginPath(); g.arc(0, -9.5, 6.2, 0, 7); g.fill(); g.beginPath(); g.moveTo(-4, -12); g.quadraticCurveTo(fx*10, -20 + fy*2, 4, -12); g.fill(); if (L.crest){ g.fillStyle = L.crest; g.beginPath(); g.arc(fx*5, -17, 2.5, 0, 7); g.fill(); } return; }
  if (L.hair){ g.fillStyle = L.hair; g.beginPath(); g.arc(-fx*1.2, -10.5 - fy*1.2, L.female ? 6.4 : 5.4, Math.PI*0.9 + (fy<0?0:0), Math.PI*2.1); g.fill(); if (L.female){ g.beginPath(); g.arc(-fx*5, -8 - fy*5, 3.2, 0, 7); g.fill(); } }
}
function emblem(g, k, x, y){
  g.save(); g.translate(x, y);
  if (k === 'lambda'){ g.strokeStyle = '#5a1012'; g.lineWidth = 2.2; g.beginPath(); g.moveTo(-4, 4); g.lineTo(0, -4); g.lineTo(4, 4); g.stroke(); }
  else if (k === 'owl'){ g.fillStyle = '#3a2a1e'; g.beginPath(); g.arc(-1.8, -1, 1.6, 0, 7); g.arc(1.8, -1, 1.6, 0, 7); g.fill(); g.beginPath(); g.moveTo(-1, 1.5); g.lineTo(0, 3.5); g.lineTo(1, 1.5); g.fill(); }
  else if (k === 'wicker'){ g.strokeStyle = '#6b5428'; g.lineWidth = 1; for (let i=-6;i<=6;i+=3){ g.beginPath(); g.moveTo(i, -6); g.lineTo(i, 6); g.stroke(); } }
  else if (k === 'sun'){ g.fillStyle = '#7a4a10'; g.beginPath(); g.arc(0, 0, 2, 0, 7); g.fill(); g.strokeStyle = '#7a4a10'; g.lineWidth = 1.1; for (let i=0;i<8;i++){ const b = i*Math.PI/4; g.beginPath(); g.moveTo(Math.cos(b)*3, Math.sin(b)*3); g.lineTo(Math.cos(b)*6.5, Math.sin(b)*6.5); g.stroke(); } }
  else if (k === 'club'){ g.strokeStyle = '#3a3f44'; g.lineWidth = 2.5; g.beginPath(); g.moveTo(-4, 4); g.lineTo(4, -4); g.stroke(); }
  g.restore();
}
function drawFallen(g, e){
  const L = e.look; g.save(); g.translate(e.x, e.y); g.rotate(e.fallA || .4); g.globalAlpha = Math.min(1, e.fade === undefined ? 1 : e.fade);
  g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(2, 3, 15, 7, 0, 0, 7); g.fill();
  g.fillStyle = shade(L.tunic, .7); g.beginPath(); g.ellipse(0, 0, 12, 6.5, 0, 0, 7); g.fill();
  g.fillStyle = shade(L.skin, .8); g.beginPath(); g.arc(13, 0, 5, 0, 7); g.fill();
  if (L.helm === 'corinth' || L.helm === 'phryg'){ g.fillStyle = '#8a6a2a'; g.beginPath(); g.arc(13, 0, 5.4, 0, 7); g.fill(); }
  if (L.helm === 'tiara'){ g.fillStyle = '#cfc6b1'; g.beginPath(); g.arc(13, 0, 5.2, 0, 7); g.fill(); }
  if (L.shield){ g.fillStyle = shade(L.shield, .75); g.beginPath(); g.arc(-6, 9, 7.5, 0, 7); g.fill(); }
  if (L.weapon === 'spear' || L.weapon === 'sarissa'){ g.strokeStyle = '#5a3f2c'; g.lineWidth = 2; g.beginPath(); g.moveTo(-14, -8); g.lineTo(22, -12); g.stroke(); }
  g.restore();
}

/* ---------- schip (trireme, van bovenaf) ---------- */
function drawShip(g, x, y, a, hull, deck, oarT, s=1, battle=true, flash=false){
  g.save(); g.translate(x, y); g.rotate(a); g.scale(s, s);
  g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(5, 6, 56, 13, 0, 0, 7); g.fill();
  /* riemen */
  g.strokeStyle = '#6b4a2e'; g.lineWidth = 1.6;
  for (let i=-36; i<=30; i+=6){ const w = Math.sin(oarT*6 + i*.2)*4; g.beginPath(); g.moveTo(i, -9); g.lineTo(i - 3 + w, -22); g.moveTo(i, 9); g.lineTo(i - 3 + w, 22); g.stroke(); }
  g.fillStyle = flash ? '#fff' : hull; g.beginPath(); g.moveTo(-48, -8); g.quadraticCurveTo(-54, 0, -48, 8); g.lineTo(38, 9); g.quadraticCurveTo(52, 6, 56, 0); g.quadraticCurveTo(52, -6, 38, -9); g.closePath(); g.fill();
  g.fillStyle = '#7d858c'; g.beginPath(); g.moveTo(56, -2); g.lineTo(64, 0); g.lineTo(56, 2); g.fill();
  g.fillStyle = deck; g.fillRect(-40, -5, 76, 10);
  g.fillStyle = '#fff'; g.beginPath(); g.arc(46, -5, 2.2, 0, 7); g.arc(46, 5, 2.2, 0, 7); g.fill(); g.fillStyle = '#111'; g.beginPath(); g.arc(46.6, -5, 1, 0, 7); g.arc(46.6, 5, 1, 0, 7); g.fill();
  if (!battle){ g.fillStyle = '#f3ead8'; g.fillRect(-4, -18, 6, 36); g.fillStyle = '#E61149'; g.fillRect(-4, -18, 6, 6); g.fillRect(-4, 12, 6, 6); }
  g.fillStyle = '#5a3f2c'; g.beginPath(); g.arc(-2, 0, 2.5, 0, 7); g.fill();
  g.restore();
}

function drawOwl(g, x, y, t){

  g.fillStyle = '#7a5a3f'; g.beginPath(); g.moveTo(-8, -6); g.lineTo(-7, -13); g.lineTo(-3, -8); g.fill(); g.beginPath(); g.moveTo(8, -6); g.lineTo(7, -13); g.lineTo(3, -8); g.fill();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(-3.5, -3, 3.4, 0, 7); g.arc(3.5, -3, 3.4, 0, 7); g.fill(); g.fillStyle = '#1f2b33'; g.beginPath(); g.arc(-3.2, -2.6, 1.7, 0, 7); g.arc(3.8, -2.6, 1.7, 0, 7); g.fill();
  g.fillStyle = '#EE7D22'; g.beginPath(); g.moveTo(-1.3, 0); g.lineTo(0, 2.6); g.lineTo(1.3, 0); g.fill();

/* ================== WERELD: zones bouwen en voorbereiden ================== */
const tpx = (x, y) => ({ x: x*T + T/2, y: y*T + T/2 });
function Zone(id, w, h, base, pal, title){ return { id, w, h, pal, title, t: new Uint8Array(w*h).fill(base), objs: [], solidRects: [], hides: [], vps: [], pts: {}, seed: id.length*97+13, naval: false, tint: null }; }
function fill(z, x, y, w, h, t){ for (let j=y; j<y+h; j++) for (let i=x; i<x+w; i++) if (i>=0 && j>=0 && i<z.w && j<z.h) z.t[j*z.w+i] = t; }
function setT(z, x, y, t){ if (x>=0 && y>=0 && x<z.w && y<z.h) z.t[y*z.w+x] = t; }
function getT(z, x, y){ return (x<0||y<0||x>=z.w||y>=z.h) ? -1 : z.t[y*z.w+x]; }
function blob(z, cx, cy, rx, ry, t, rough=.25, seed=1, only){ const R = seeded(seed*31+7); for (let j=Math.floor(cy-ry-2); j<=cy+ry+2; j++) for (let i=Math.floor(cx-rx-2); i<=cx+rx+2; i++){ const d = ((i-cx)/rx)**2 + ((j-cy)/ry)**2; if (d < 1 - rough*R()) { if (!only || only.includes(getT(z,i,j))) setT(z, i, j, t); } } }
function road(z, pts, w, t){ for (let k=0; k<pts.length-1; k++){ const [x1,y1] = pts[k], [x2,y2] = pts[k+1], n = Math.max(Math.abs(x2-x1), Math.abs(y2-y1))*2+1; for (let s=0; s<=n; s++){ const x = x1 + (x2-x1)*s/n, y = y1 + (y2-y1)*s/n; fill(z, Math.round(x - w/2), Math.round(y - w/2), w, w, t); } } }
function O(z, type, o, solid){ o.type = type; z.objs.push(o); if (solid){ const r = solid === true ? o : solid; z.solidRects.push(r); } return o; }
/* object op tegelcoördinaten (gebouwen) */
function bld(z, type, tx, ty, tw, th, extra={}){ return O(z, type, Object.assign({ x: tx*T+2, y: ty*T+2, w: tw*T-4, h: th*T-4, tx, ty, tw, th }, extra), true); }
function tree(z, tx, ty, k='olive'){ const p = tpx(tx, ty); O(z, 'tree', { x: p.x, y: p.y, k, tx, ty, tw: 1, th: 1 }, { tx, ty, tw: 1, th: 1 }); }
function hide(z, tx, ty, k='bush'){ const p = tpx(tx, ty); O(z, k, { x: p.x, y: p.y }); z.hides.push({ x: p.x, y: p.y, r: 20 }); }
function vp(z, id, tx, ty, label){ const p = tpx(tx, ty); z.vps.push({ id, x: p.x, y: p.y, label }); O(z, 'owlstone', { x: p.x, y: p.y }); }

function finalize(z){

function mkEnt(o){
  const L = typeof o.look === 'string' ? LOOK[o.look] : o.look;
  const e = Object.assign({ x: 0, y: 0, r: 10, dir: Math.PI/2, hp: 3, maxhp: 3, speed: 70, team: 'n', kind: 'npc', atkT: 0, cd: 0, flash: 0, moving: false, state: 'idle', big: 1, tag: 'step', reach: 36, dmg: 1 }, o);

/* ---------- botsingen met de wereld ---------- */
function solidAt(px, py){ const tx = Math.floor(px/T), ty = Math.floor(py/T); if (tx<0 || ty<0 || tx>=Z.w || ty>=Z.h) return true; return Z.solid[ty*Z.w+tx] === 1; }
function blocked(x, y, r){ return solidAt(x-r, y-r) || solidAt(x+r, y-r) || solidAt(x-r, y+r) || solidAt(x+r, y+r); }
function moveEnt(e, dx, dy){ const r = e.r*.75; let ok = true; if (dx){ if (!blocked(e.x+dx, e.y, r)) e.x += dx; else ok = false; } if (dy){ if (!blocked(e.x, e.y+dy, r)) e.y += dy; else ok = false; } return ok; }
function los(a, b){ const d = dist(a, b), n = Math.ceil(d/12); for (let i=1;i<n;i++){ const x = lerp(a.x, b.x, i/n), y = lerp(a.y, b.y, i/n); if (solidAt(x, y)) return false; } return true; }
function steer(e, tx, ty, sp, dt){ const a = Math.atan2(ty - e.y, tx - e.x); e.dir = a; const ok = moveEnt(e, Math.cos(a)*sp*dt, Math.sin(a)*sp*dt); if (!ok){ const a2 = a + (e.side||1)*Math.PI/2; moveEnt(e, Math.cos(a2)*sp*dt*.8, Math.sin(a2)*sp*dt*.8); if (Math.random()<.01) e.side = -(e.side||1); } e.moving = true; }

/* ---------- deeltjes ---------- */
function puff(x, y, type, n=6){
  for (let i=0;i<n;i++){
    const p = { x, y, vx: rnd(-40,40), vy: rnd(-40,40), life: 0, max: rnd(.4,.8), s: rnd(2,4), c: '#d8c8a8', g: 0, type };
    if (type === 'spark'){ p.c = pick(['#fff4c4','#ffd76a','#ffffff']); p.vx = rnd(-160,160); p.vy = rnd(-160,160); p.max = rnd(.15,.3); p.s = 2; }
    if (type === 'blood'){ p.c = pick(['#7a1018','#9b1a22','#5a0c10']); p.vx = rnd(-90,90); p.vy = rnd(-110,30); p.g = 260; p.max = rnd(.3,.5); p.s = rnd(1.5,3); }
    if (type === 'ember'){ p.c = pick(['#ffb347','#ff7a2a','#ffd76a']); p.vx = rnd(-15,15); p.vy = rnd(-60,-25); p.max = rnd(1,2.2); p.s = rnd(1.2,2.4); }
    if (type === 'smoke'){ p.c = 'rgba(60,55,55,'; p.vx = rnd(-10,10)+12; p.vy = rnd(-35,-15); p.max = rnd(2,3.5); p.s = rnd(10,18); }
    if (type === 'splash'){ p.c = '#e6f6f8'; p.vx = rnd(-70,70); p.vy = rnd(-70,70); p.max = rnd(.4,.8); p.s = rnd(2,3.5); }
    if (type === 'wood'){ p.c = pick(['#6b4a2e','#4a3020','#8a6440']); p.vx = rnd(-110,110); p.vy = rnd(-110,110); p.max = rnd(.8,1.6); p.s = rnd(3,6); }
    if (type === 'gold'){ p.c = pick(['#ffe28a','#e9b04a','#fff']); p.vx = rnd(-60,60); p.vy = rnd(-90,-20); p.max = rnd(.5,1); p.s = 2.5; }
    parts.push(p);
  }
  if (parts.length > 700) parts.splice(0, parts.length - 700);
}
function stain(x, y){ decals.push({ x: x + rnd(-6,6), y: y + rnd(-4,8), r: rnd(3,7), a: .55 }); if (decals.length > 90) decals.shift(); }

/* ---------- schade ---------- */
function damage(t, d, src){
  if (t.dead || t.invul > 0) return;
  if (t.kind === 'player' && G.mode !== 'play') return;
  if (t.kind === 'guard' && t.state !== 'hunt'){ t.state = 'hunt'; t.team = 'p'; SFX.alert(); }
  t.hp -= d; t.flash = .12; t.hitT = 0;

/* ---------- AI ---------- */
function nearestHostile(e, range){ let best = null, bd = range; for (const o of ents){ if (o === e || o.kind === 'ship' || !hostile(e, o)) continue; const d = dist(e, o); if (d < bd){ bd = d; best = o; } } return best; }
function updateAI(e, dt){
  if (e.dead){ e.deadT += dt; if (e.team !== 'g' && e.deadT > 30) e.fade = Math.max(0, e.fade - dt*.2); return; }
  e.moving = false;
  if (e.kind === 'npc'){
    if (e.follow && !e.safe){ const d = dist(e, P); if (d > 44 && d < 260) steer(e, P.x, P.y, P.speed * (d > 120 ? 1.4 : 1), dt); else if (d <= 44) e.dir = Math.atan2(P.y - e.y, P.x - e.x); }

    else if (e.wander){ e.wt = (e.wt||0) - dt; if (e.wt <= 0){ e.wt = rnd(2, 5); e.wp = { x: e.home.x + rnd(-e.wander, e.wander), y: e.home.y + rnd(-e.wander, e.wander) }; } if (e.wp && dist(e, e.wp) > 6 && !blocked(e.wp.x, e.wp.y, 6)) steer(e, e.wp.x, e.wp.y, e.speed*.6, dt); }
    if (!e.moving && dist(e, P) < 70 && (e.talk || e.faceP)) e.dir = Math.atan2(P.y - e.y, P.x - e.x);
    return;
  }
  if (e.kind === 'guard') return updateGuard(e, dt);

    const tgt = nearestHostile(e, 110);
    if (e.windup > 0){ e.windup -= dt; if (tgt) e.dir = Math.atan2(tgt.y - e.y, tgt.x - e.x); if (e.windup <= 0) swing(e); return; }

    else { e.dir = Math.PI; moveEnt(e, -e.speed*dt, 0); e.moving = true; }
    return;
  }
  if (e.kind === 'soldier' || e.kind === 'archer'){
    const tgt = nearestHostile(e, e.aggro || 900);
    if (!tgt){ if (e.post && dist(e, e.post) > 10) steer(e, e.post.x, e.post.y, e.speed*.8, dt); else if (e.march) { steer(e, e.x + Math.cos(e.march)*40, e.y + Math.sin(e.march)*40, e.speed*.5, dt); } return; }
    const d = dist(e, tgt);
    if (e.kind === 'archer'){
      e.dir = Math.atan2(tgt.y - e.y, tgt.x - e.x);
      if (d < 150) steer(e, e.x - Math.cos(e.dir)*30, e.y - Math.sin(e.dir)*30, e.speed, dt); else if (d > 300) steer(e, tgt.x, tgt.y, e.speed, dt);
      if (e.cd <= 0 && d < 340){ e.cd = rnd(1.8, 2.8); shoot(e, tgt); }
      e.dir = Math.atan2(tgt.y - e.y, tgt.x - e.x); return;
    }
    if (e.windup > 0){ e.windup -= dt; e.dir = Math.atan2(tgt.y - e.y, tgt.x - e.x); if (e.windup <= 0) swing(e); return; }
    if (d > e.reach + tgt.r - 4){ steer(e, tgt.x, tgt.y, e.speed, dt); }
    else { e.dir = Math.atan2(tgt.y - e.y, tgt.x - e.x); if (e.cd <= 0){ e.windup = tgt.kind === 'player' ? .38 : .2; } }
  }
}
function shoot(e, tgt){ const a = Math.atan2(tgt.y - e.y, tgt.x - e.x) + rnd(-.08,.08); projs.push({ x: e.x, y: e.y - 6, vx: Math.cos(a)*280, vy: Math.sin(a)*280, team: e.team, life: 1.6, src: e }); SFX.swing(); }

/* sluipen: wachters met zichtveld */
function updateGuard(e, dt){
  const seeP = !P.dead && !P.hidden && dist(e, P) < 190 && Math.abs(angDiff(e.dir, Math.atan2(P.y - e.y, P.x - e.x))) < .85 && los(e, P);

    if (seeP || dist(e, P) < 40) e.lost = 0; else e.lost = (e.lost||0) + dt;
    if (e.lost > 4 || (P.hidden && dist(e, P) > 40)){ e.state = 'search'; e.sus = .5; e.searchT = 3; return; }
    const d = dist(e, P);
    if (e.windup > 0){ e.windup -= dt; e.dir = Math.atan2(P.y - e.y, P.x - e.x); if (e.windup <= 0) swing(e); return; }

}

}

/* ---------- schepen (Salamis) ---------- */
function mkShip(o){ return Object.assign({ kind: 'ship', a: 0, v: 0, hp: 2, maxhp: 2, r: 30, team: 'p', hull: '#3a2a3a', deck: '#7a2f4a', oarT: 0, flash: 0, x: 0, y: 0 }, o); }

function updateShip(s, dt, ctrl){

  if (ctrl){ const I = inp(); const rot = (kd('KeyA','ArrowLeft') || touch.x < -.4 ? -1 : 0) + (kd('KeyD','ArrowRight') || touch.x > .4 ? 1 : 0);
    const thr = (kd('KeyW','ArrowUp') || touch.y < -.4) ? 1 : (kd('KeyS','ArrowDown') || touch.y > .4) ? -1 : 0;
    const boost = I.run && stamina > .05; if (boost && thr > 0) stamina = Math.max(0, stamina - dt*.35); else stamina = Math.min(1, stamina + dt*.15);

    const items = q.items.map((t,i) => ({ t, k: i })); let order = shuffleA(items); let g = 0; while (order.every((o,i) => o.k === i) && g++ < 9) order = shuffleA(items);
    card.innerHTML = head + `<ol class="slist" id="sl"></ol><div class="qrow"><button class="btn" id="chk">${ICO.check} Controleer</button></div>` + tail;
    const draw = lock => { $('#sl').innerHTML = order.map((o,p) => `<li class="sitem ${o.s||''}" data-p="${p}"><span class="num">${p+1}</span><span class="stxt">${o.t}</span><span class="arrows"><button class="ar" data-d="-1" ${lock||p===0?'disabled':''}>${ICO.up}</button><button class="ar" data-d="1" ${lock||p===order.length-1?'disabled':''}>${ICO.down}</button></span></li>`).join('');
      if (!lock) $('#sl').querySelectorAll('.ar').forEach(b => b.onclick = () => { const p = +b.closest('li').dataset.p, d = +b.dataset.d; [order[p], order[p+d]] = [order[p+d], order[p]]; order.forEach(o => o.s = ''); draw(false); }); };
    draw(false); bindHint();
    $('#chk').onclick = () => { const ok = order.every((o,i) => o.k === i);
      if (ok){ order.forEach(o => o.s = 'good'); draw(true); const pts = tries ? .5 : 1; record(id, pts); reward(pts); $('#chk').remove(); fb(true); nextBtn(); }
      else { tries++; markTry(); SFX.bad(); addDr(-2); order.forEach((o,i) => o.s = o.k === i ? 'good' : 'wrong'); draw(false);
        if (tries >= 2){ record(id, 0); order = items.map(o => Object.assign(o, { s: 'good' })); draw(true); $('#chk').remove(); fb(false, true); nextBtn(); } else fb(false, false); } };
  }
  if (q.type === 'cat'){
    const pickd = {};
    card.innerHTML = head + `<div class="cats">${q.items.map((it,i) => `<div class="crow" data-i="${i}"><span class="ctxt">${it[0]}</span><span class="cbtns">${q.bins.map(b => `<button class="cb" data-k="${b.k}" style="--c:${b.c}">${b.n}</button>`).join('')}</span></div>`).join('')}</div><div class="qrow"><button class="btn" id="chk">${ICO.check} Controleer</button></div>` + tail;
    bindHint(); const rows = card.querySelectorAll('.crow');
    rows.forEach(r => r.querySelectorAll('.cb').forEach(b => b.onclick = () => { pickd[+r.dataset.i] = b.dataset.k; r.querySelectorAll('.cb').forEach(x => x.classList.toggle('sel', x === b)); r.classList.remove('good','wrong'); }));
    const lock = show => rows.forEach(r => r.querySelectorAll('.cb').forEach(b => { b.disabled = true; if (show) b.classList.toggle('sel', b.dataset.k === q.items[+r.dataset.i][1]); }));
    $('#chk').onclick = () => { if (Object.keys(pickd).length < q.items.length){ const f = $('#qfb'); f.className = 'fb no'; f.innerHTML = 'Kies eerst bij <b>elke</b> regel een antwoord.'; return; }
      let all = true; rows.forEach(r => { const i = +r.dataset.i, ok = pickd[i] === q.items[i][1]; r.classList.toggle('good', ok); r.classList.toggle('wrong', !ok); if (!ok) all = false; });
      if (all){ const pts = tries ? .5 : 1; record(id, pts); reward(pts); lock(false); $('#chk').remove(); fb(true); nextBtn(); }
      else { tries++; markTry(); SFX.bad(); addDr(-2); if (tries >= 2){ record(id, 0); rows.forEach(r => { r.classList.remove('wrong'); r.classList.add('good'); }); lock(true); $('#chk').remove(); fb(false, true); nextBtn(); } else fb(false, false); } };
  }
  box.classList.add('open'); card.scrollTop = 0;
  if (q.src) addSrc(q.src);
}

function viewpoint(v){
  st.vps = st.vps || {}; st.vps[v.id] = true; save();
  G.mode = 'vp'; G.vpAnim = { t: 0, v }; zoomTarget = .5; SFX.horn();

      zoomTarget = baseZoom(); G.vpAnim = null;
      let best = null, bd = 1e9; for (const h of Z.hides){ const d = Math.hypot(h.x - v.x, h.y - v.y); if (d < bd){ bd = d; best = h; } }
      if (best && bd < 900){ P.x = best.x; P.y = best.y; puff(P.x, P.y, 'dust', 14); toast('Je springt in het hooi. <b>+20 drachmen</b>'); }

  a_burger:{type:'mc', label:'Wie was Atheens burger?', page:'Les 4 deel 1, p. 29-34', q:'Wie werd in Athene <b>burger</b>?', opts:['iedere inwoner van Athene','vrije mannen vanaf 18 jaar, geboren uit Atheense ouders','alle mannen en vrouwen boven 18 jaar','iedereen die belastingen betaalt'], ok:1, hint:'Kallias zei het net: geslacht, leeftijd en afkomst tellen mee.', uitleg:'Atheense burgers waren vrije mannen vanaf 18 jaar die geboren waren uit Atheense ouders. Alleen zij hadden burgerrechten.'},
  a_metoik:{type:'mc', label:'Rechten en plichten van migranten', page:'Les 4 deel 1, p. 29-34', q:'Sostratos is een <b>migrant</b>. Wat klopt over zijn rechten en plichten?', opts:['Hij is onvrij en eigendom van de polis.','Hij is vrij, maar mag geen huis of grond bezitten en betaalt extra belastingen.','Hij heeft dezelfde rechten als een burger.','Hij mag meestemmen in de Volksvergadering.'], ok:1, hint:'Migranten waren tweederangsinwoners: vrij, maar met minder rechten en meer plichten.', uitleg:'Migranten en hun afstammelingen waren vrij, maar hadden minder rechten en meer plichten dan burgers: geen huizen of gronden, extra belastingen. Ze werkten meestal als ambachtslui of handelaars.'},
  a_slaaf:{type:'mc', label:'Slaven in Athene', page:'Les 4 deel 1, p. 29-34', q:'Wat was een <b>slaaf</b> in Athene?', opts:['een onvrije mens, eigendom van vrije mensen of van de polis, met amper rechten','een arme burger','een migrant zonder werk','een hopliet in het leger'], ok:0, hint:'Daos is niet vrij. Van wie is hij?', uitleg:'Slaven waren onvrij en eigendom van vrije mensen of van de polis. Ze waren rechteloos, maar wel essentieel voor de economie: de grootste groep werkkrachten.'},
  a_vrouw:{type:'mc', label:'De rol van vrouwen', page:'Les 4 deel 1, p. 29-34', q:'Welke rol hadden <b>vrouwen</b> in Athene?', opts:['Ze leidden het huishouden en hadden geen stem in het publieke leven.','Ze bestuurden samen met de mannen de polis.','Ze werden op hun 18de burger met stemrecht.','Ze waren de strategen van het leger.'], ok:0, hint:'Waar ontmoette je Agariste? Op de Pnyx of thuis?', uitleg:'Vrouwen, ook die van burgerlijke afkomst, leidden het huishouden en hadden geen stem in het publieke leven. De Atheense samenleving was patriarchaal: een mannenmaatschappij.'},
  a_stand:{type:'mc', label:'Standenmaatschappij', page:'Les 4 deel 1, p. 29-34', q:'Je plaats in Athene hing af van geboorte, geslacht, leeftijd, afkomst en grondbezit. Hoe noem je zo\'n samenleving?', opts:['een democratie','een standenmaatschappij','een gesloten landbouwsamenleving','een oligarchie'], ok:1, hint:'Niet iedereen is gelijk: er zijn verschillende "standen".', uitleg:'Athene was een standenmaatschappij: niet iedereen was gelijk. Er waren vrijen en onvrijen, en ook tussen de vrijen waren er grote verschillen.'},
  a_bestuur:{type:'sort', label:'Evolutie van de bestuursvorm in Athene', page:'Les 4 deel 2, p. 29-34', q:'Zet de bestuursvormen van Athene in de juiste volgorde: de oudste bovenaan.', items:['monarchie: een koning heeft alle macht','aristocratie: rijke grootgrondbezitters nemen de macht (8ste eeuw v.C.)','alle rijke burgers krijgen inspraak (6de eeuw v.C.)','democratie: alle burgers beslissen mee (vanaf 508 v.C.)'], hint:'Het begint met één persoon aan de macht en eindigt met het volk.', uitleg:'Monarchie, daarna aristocratie, daarna inspraak voor alle rijke burgers (om sociale spanningen te vermijden) en in 508 v.C. de democratie.'},
  a_stem:{type:'mc', label:'Wie stemt in de Volksvergadering?', page:'Les 4 deel 2, p. 29-34', q:'Wie mocht meestemmen in de <b>Volksvergadering</b> op de Pnyx?', opts:['alle inwoners van Athene','alleen de rijke elite','alle burgers, rijk en arm','alleen de strategen'], ok:2, hint:'Sinds 508 v.C. worden alle burgers betrokken in de politiek.', uitleg:'Alle burgers, rijk en arm (ca. 35 000), maakten deel uit van de Volksvergadering. Daar bespraken en stemden ze wetten. Vrouwen, migranten en slaven waren uitgesloten.'},
  a_machten:{type:'cat', label:'De drie machten in de Atheense democratie', page:'Les 4 deel 2, p. 29-34 (schema)', q:'Bij welke <b>macht</b> hoort elk bestuursorgaan?', bins:[{k:'W',n:'Wetgevend',c:'#009BA8'},{k:'U',n:'Uitvoerend',c:'#EE7D22'},{k:'R',n:'Rechterlijk',c:'#E61149'}], items:[['De Volksvergadering bespreekt en stemt wetten','W'],['De Raad van 500 bereidt de Volksvergadering voor','W'],['De magistraten voeren de besluiten uit','U'],['De tien strategen leiden het leger','U'],['De Volksrechtbank spreekt recht en straft','R']], hint:'Wetgevend maakt wetten, uitvoerend voert ze uit, rechterlijk controleert en straft.', uitleg:'Volksvergadering en Raad van 500: wetgevend. Magistraten (met de strategen aan de top): uitvoerend. Volksrechtbank: rechterlijk. Zo ligt de macht niet bij één persoon: scheiding der machten.'},
  a_loting:{type:'mc', src:'klero', label:'Loting', page:'Les 4 deel 2, p. 29-34', q:'Met deze stenen machine werden namen getrokken. Hoe werden de meeste <b>magistraten</b> en de leden van de Volksrechtbank aangeduid?', opts:['door loting','door verkiezingen','door de koning','door geboorte in een rijke familie'], ok:0, hint:'De machine heet een klèrotèrion: een lotingsmachine.', uitleg:'Elk jaar werden burgers door loting aangeduid voor openbare functies. Alleen de strategen, de top van de magistraten, werden verkozen door de Volksvergadering.'},
  a_ostra:{type:'mc', src:'ostrakon', label:'Ostracisme (schervengericht)', page:'Les 4 deel 2, p. 29-34', q:'Waarom hielden de Atheners een <b>ostracisme</b>?', opts:['om belastingen te innen','om iemand die te veel macht naar zich toe trok voor tien jaar te verbannen en zo de democratie te beschermen','om nieuwe burgers te kiezen','om slaven vrij te laten'], ok:1, hint:'Wat doe je met iemand die tiran wil worden?', uitleg:'Om machtsmisbruik te voorkomen voerde elke magistraat zijn taak maar één jaar uit. Trok iemand toch te veel macht naar zich toe, dan kon hij via een ostracisme voor tien jaar uit Athene verbannen worden.'},
  a_vbe:{type:'mc', v:true, label:'V+ Athene en België vergelijken', page:'Les 4 deel 2 + V+ in Classroom', q:'Vergelijk de Atheense democratie met de Belgische. Wat is een groot verschil?', opts:['In Athene beslisten de burgers zelf (directe democratie), in België kiezen we vertegenwoordigers (indirecte democratie).','België heeft geen verkiezingen.','In Athene mochten vrouwen stemmen, in België niet.','Er is geen enkel verschil.'], ok:0, hint:'Ga jij zelf in het parlement over elke wet stemmen?', uitleg:'Athene had een directe democratie, België een indirecte: wij kiezen vertegenwoordigers. En in België mogen ook vrouwen stemmen, iets wat in Athene ondenkbaar was.'},

  b_ligging:{type:'mc', label:'De ligging van Sparta', page:'Les 4 deel 3, p. 29-34', q:'Waarom had Sparta weinig economische contacten met andere poleis en overzeese gebieden?', opts:['Het lag in een vallei omsloten door het Taygetosgebergte, zonder directe toegang tot de zee.','Het lag op een eiland.','De Spartanen spraken geen Grieks.','Sparta had een verbod op reizen.'], ok:0, hint:'Denk aan wat je zag vanaf het uitkijkpunt.', uitleg:'Sparta was een gesloten continentale polis met een gesloten landbouweconomie: een vruchtbare vallei, omsloten door bergen, zonder directe toegang tot de zee.'},
  b_heloot:{type:'mc', label:'De heloten', page:'Les 4 deel 3, p. 29-34', q:'Wie waren de <b>heloten</b>?', opts:['de Spartaanse koningen','de slaven van Sparta, die de gronden van de Spartanen bewerkten','migranten uit Athene','de leden van de raad van ouderen'], ok:1, hint:'Je sprak er net een op de akkers.', uitleg:'Heloten waren de Spartaanse slaven. Zij werkten op de gronden van de Spartanen, die zelf maar één beroep hadden: soldaat.'},
  b_militair:{type:'mc', label:'Militaristische staat', page:'Les 4 deel 3, p. 29-34', q:'Waarom had Sparta zo\'n sterk leger nodig?', opts:['om de grote groep heloten te onderdrukken en omliggende landbouwgronden te veroveren','om handel te drijven overzee','om de Olympische Spelen te winnen','om tempels te bouwen'], ok:0, hint:'Wie zou er in opstand kunnen komen?', uitleg:'Een sterk leger was nodig om de grote groep heloten te onderdrukken en om gronden te veroveren. Daarom was Sparta een militaristische staat: de hele samenleving was gericht op oorlog voeren.'},
  b_opvoeding:{type:'mc', label:'De Spartaanse opvoeding', page:'Les 4 deel 3, p. 29-34', q:'Wat weten historici met zekerheid over de Spartaanse <b>opvoeding</b>?', opts:['Kinderen werden jong uit hun gezin gehaald en in groepen opgeleid door de staat, met fysieke training én muziek en poëzie.','Kinderen bleven thuis tot hun 18de.','Er was alleen fysieke training, nooit muziek of poëzie.','Alleen meisjes kregen een opleiding.'], ok:0, hint:'Luister nog eens naar de trainer: niet alleen spieren.', uitleg:'Historici zijn het eens dat Spartaanse kinderen jong uit hun gezin werden gehaald en in groepen door de staat werden opgeleid. Naast fysieke training was er ook ruimte voor muziek en poëzie.'},
  b_olig:{type:'mc', label:'Oligarchie in Sparta', page:'Les 4 deel 3, p. 29-34', q:'In Sparta zijn de twee koningen vooral legeraanvoerders. De politieke macht ligt bij de gerousia, een raad van 28 ouderen. Welke bestuursvorm is dat?', opts:['monarchie','democratie','oligarchie','tirannie'], ok:2, hint:'Een kleine groep mensen regeert.', uitleg:'Een oligarchie: de macht ligt bij een kleine groep mensen, hier de raad van ouderen.'},
  b_bron:{type:'mc', src:'plutarchus', label:'Bronnenkritiek: Plutarchus over Sparta', page:'Les 4 deel 4, p. 29-34', q:'Deze bron over de harde Spartaanse opvoeding werd geschreven door Plutarchus, rond 100 n.C. Waarom moet je als historicus <b>voorzichtig</b> zijn?', opts:['Hij schreef meer dan 500 jaar later en was zelf geen Spartaan. Eén bron is geen bron: je moet vergelijken.','Omdat de bron in het Grieks geschreven is.','Plutarchus was een Perzische koning.','Er is geen reden: een oude bron is altijd betrouwbaar.'], ok:0, hint:'Kijk naar het jaartal: wanneer schreef hij, en over welke periode?', uitleg:'Betrouwbaarheid: Plutarchus schreef eeuwen later en niet als Spartaan. Representativiteit: één bron is geen bron, je hebt er meerdere nodig om te weten wat typisch was.'},
  b_v300:{type:'mc', v:true, label:'V+ De film 300 en ons beeld van Sparta', page:'Les 4 deel 4 en Les 1 deel 1', q:'In de film <i>300</i> (2006) zijn Spartanen onverslaanbare superhelden. Met welk doel verwijst zo\'n film naar het verleden?', opts:['om te ontspannen en spektakel te tonen, waardoor er onjuiste beeldvorming in sluipt','om een betrouwbaar historisch werk te maken','omdat er geen bronnen zijn','om de Perzen correct voor te stellen'], ok:0, hint:'Denk aan Les 1: populaire media.', uitleg:'Films en games willen vooral ontspannen. Daardoor geven ze vaak een vertekend beeld van het verleden, ook van Sparta en de Perzen.'},

  c_oorzaak:{type:'mc', label:'Waarom oorlog met de Perzen?', page:'Les 5 deel 1, p. 35-39', q:'Waarom botsten de Griekse poleis en het Perzische rijk?', opts:['om de controle over kustgebieden, handelsroutes en grondstoffen','omdat de Perzen de Olympische Spelen wilden','omdat Sparta Perzië aanviel','enkel om godsdienstige redenen'], ok:0, hint:'Denk aan de handel van de open landbouwsamenleving (Les 2).', uitleg:'De Griekse poleis en het Perzische rijk botsten aan de westkust van Klein-Azië. De controle over kustgebieden, handelsroutes en grondstoffen speelde mee.'},
  c_ionisch:{type:'mc', label:'De Ionische Opstand', page:'Les 5 deel 1, p. 35-39', q:'De oorlog begon na de <b>Ionische Opstand</b> (499 tot 493 v.C.). Waar speelde die zich af?', opts:['in de Griekse steden aan de westkust van Klein-Azië','in Sparta','op Sicilië','in Egypte'], ok:0, hint:'Miltiades wees naar het oosten, over de zee.', uitleg:'De Griekse steden aan de westkust van Klein-Azië kwamen in opstand tegen de Perzen, met hulp van Athene. Daarna wilde de Perzische koning wraak.'},
  c_helm:{type:'mc', src:'helm', label:'Bron B4: de helm van Miltiades', page:'Herhaling 1, p. 5-6', q:'Na de slag schenkt Miltiades zijn helm aan Zeus in Olympia. Archeologen vonden hem terug. Wat voor <b>bron</b> is die helm?', opts:['een materiële (archeologische) en primaire bron','een geschreven en secundaire bron','een monumentale bron','een secundair werk'], ok:0, hint:'Het is een voorwerp uit de tijd zelf.', uitleg:'Een opgegraven voorwerp uit de tijd zelf: een materiële (archeologische) en primaire bron.'},

  d_solid:{type:'mc', label:'Solidariteit tegen de Perzen', page:'Les 4 deel 5 en Les 5 deel 2', q:'Spartanen, Thespiërs, Thebanen en vele anderen vechten hier samen tegen de Perzen. Hoe noem je dat?', opts:['rivaliteit','solidariteit','oligarchie','tirannie'], ok:1, hint:'Bij een externe dreiging zoeken de poleis steun bij elkaar.', uitleg:'Bij externe dreiging werkten de poleis samen: solidariteit. Elke polis had wel haar eigen bestuur.'},
  d_thermo:{type:'mc', label:'Waarom Thermopylae verloren ging', page:'Les 5 deel 1, p. 35-39', q:'Waarom verloren de Grieken bij Thermopylae toch?', opts:['Volgens Herodotus toonde een Griek de Perzen een bergpad, zodat ze de Grieken konden omsingelen.','De Grieken liepen weg.','Het begon te sneeuwen.','De Spartanen vochten voor de Perzen.'], ok:0, hint:'Van waar kwamen de laatste vijanden?', uitleg:'Volgens de Griekse geschiedschrijver Herodotus wees een verrader de Perzen een pad over de bergen. Zo werden de Grieken langs twee kanten aangevallen.'},
  d_300:{type:'mc', label:'Het beeld van de 300', page:'Les 5 deel 1 en 2 (beeldvorming)', q:'Het bekende verhaal spreekt van "de 300 Spartanen". Wat klopt er niet aan dat beeld?', opts:['Er vochten ook enkele duizenden andere Grieken mee. Op het einde bleven er vooral Spartanen, Thespiërs en Thebanen over.','Er waren helemaal geen Spartanen.','Thermopylae ligt in Egypte.','De slag vond plaats in 338 v.C.'], ok:0, hint:'Wie stond er naast jou in de pas?', uitleg:'Het "300"-verhaal maakt van Sparta de enige held. In werkelijkheid vochten duizenden Grieken uit verschillende poleis samen. Kritisch kijken naar zo\'n beeld is werk voor een historicus.'},
  d_brand:{type:'mc', label:'Athene in 480 v.C.', page:'Les 5 deel 1, p. 35-39', q:'Wat gebeurde er in 480 v.C. met Athene?', opts:['De stad werd door de Perzen geplunderd en in brand gestoken.','Athene werd een monarchie.','Athene won de Olympische Spelen.','De stad werd door Sparta veroverd.'], ok:0, hint:'Je zag het met eigen ogen.', uitleg:'In 480 v.C. werd Athene geplunderd en in brand gestoken. De meeste Atheners waren op tijd gevlucht, onder meer naar het eiland Salamis.'},
  d_salamis:{type:'mc', src:'trireme', label:'De zeeslag bij Salamis', page:'Les 5 deel 1, p. 35-39', q:'Waarom konden de Grieken bij Salamis winnen tegen een veel grotere Perzische vloot?', opts:['In de smalle zeestraat konden de vele Perzische schepen niet goed manoeuvreren. De Griekse triremen ramden ze.','De Perzen hadden geen schepen.','Het was windstil, dus de Perzen konden niet varen.','Sparta stuurde duizend schepen.'], ok:0, hint:'Hoe breed was het water waar je vocht?', uitleg:'Themistokles lokte de Perzische vloot in de smalle zeestraat bij Salamis. Daar zaten de grote schepen elkaar in de weg en konden de Griekse triremen ze rammen.'},
  d_chrono:{type:'sort', label:'Verloop van de Perzische Oorlogen', page:'Les 5 deel 1, p. 35-39', q:'Zet het verloop van de Perzische Oorlogen in de juiste volgorde: het oudste bovenaan.', items:['Ionische Opstand (499 tot 493 v.C.)','slag bij Marathon (490 v.C.)','slag bij Thermopylae (480 v.C.)','Athene geplunderd en in brand (480 v.C.)','zeeslag bij Salamis (480 v.C.)','de vrede van Callias'], hint:'Je hebt het allemaal zelf beleefd, in deze volgorde.', uitleg:'Ionische Opstand, Marathon, Thermopylae, Athene in brand, Salamis. Daarna volgen nog Griekse overwinningen. De vrede van Callias wordt traditioneel als einde genoemd, al discussiëren historici over hoe formeel dat verdrag was.'},
  d_wijzij:{type:'mc', label:'Het "wij tegen zij"-beeld', page:'Les 5 deel 2, p. 35-39', q:'Na de oorlogen zagen Grieken zichzelf als "vrij" en de Perzen als "slaven van één alleenheerser". Hoe kijkt een historicus naar zo\'n beeld?', opts:['kritisch: het is beeldvorming die een volk eenzijdig voorstelt en later opnieuw gebruikt werd','als de enige waarheid','als een betrouwbare primaire bron over alle Perzen','het is niet belangrijk'], ok:0, hint:'Wie vertelt het verhaal hier, de Grieken of de Perzen?', uitleg:'Het "wij tegen zij"-denken is historische beeldvorming. Het werd later opnieuw gebruikt om volkeren uit het Oosten als tegenstander voor te stellen. Daarom bekijk je het kritisch.'},

  e_bond:{type:'mc', label:'Het bondgenootschap', page:'Les 4 deel 5, p. 29-34', q:'Na de Perzische Oorlogen sluiten veel poleis een <b>bondgenootschap</b> met Athene. Wat is dat?', opts:['een afspraak tussen staten of poleis om elkaar te helpen','een Griekse munt','een tempel voor Athena','een soort toneelstuk'], ok:0, hint:'Bond-genoot: iemand die met jou verbonden is.', uitleg:'Een bondgenootschap is een samenwerkingsverband tussen staten of poleis, vooral tijdens een oorlog. Athene stond aan het hoofd ervan.'},
  e_macht:{type:'mc', label:'Hoe Athene zijn macht toonde', page:'Les 4 deel 5, p. 29-34', q:'Athene groeit in de 5de eeuw v.C. uit tot een economische, culturele en militaire macht. Hoe zie je dat in de stad?', opts:['aan de schitterende gebouwen op de Akropolis, zoals het Parthenon','aan de afgebroken tempels','aan een muur rond Sparta','aan het verdwijnen van het leger'], ok:0, hint:'Kijk eens omhoog naar de Akropolis.', uitleg:'De macht van Athene kwam tot uiting in de schitterende gebouwen op de Akropolis, gebouwd na de verwoesting door de Perzen.'},
  e_rival:{type:'mc', label:'Waarom de spanning groeide', page:'Les 5 deel 2, p. 35-39', q:'Waarom groeide de spanning tussen Athene en andere poleis, zoals Sparta?', opts:['Athene misbruikte zijn macht in het bondgenootschap en de bondgenootschappen beconcurreerden elkaar.','Athene werd een oligarchie.','Sparta wilde de democratie invoeren.','Ze spraken een andere taal.'], ok:0, hint:'Wat vertelde de handelaar uit Naxos?', uitleg:'Het machtsmisbruik van Athene en de concurrentie tussen de bondgenootschappen zorgden opnieuw voor rivaliteit, vooral tussen Athene en Sparta.'},
  e_verh:{type:'cat', label:'Solidariteit of rivaliteit?', page:'Les 4 deel 5 en Les 5 deel 2', q:'Is elke situatie een voorbeeld van <b>solidariteit</b> of van <b>rivaliteit</b>?', bins:[{k:'S',n:'Solidariteit',c:'#94C021'},{k:'R',n:'Rivaliteit',c:'#E61149'}], items:[['Grieken uit veel poleis vechten samen bij Thermopylae','S'],['Athene en Sparta voeren jarenlang oorlog','R'],['Poleis sluiten een bondgenootschap tegen de Perzen','S'],['Athene dwingt bondgenoten om te blijven betalen','R'],['Spartanen branden de akkers rond Athene plat','R']], hint:'Solidariteit: steun zoeken bij elkaar. Rivaliteit: strijd om macht en invloed.', uitleg:'Bij een gemeenschappelijke vijand: solidariteit. Zodra die weg was, kwam de strijd om macht terug: rivaliteit. Griekenland werd jarenlang geteisterd door interne oorlogen.'},

  f_phil:{type:'mc', label:'Philippos van Makedonië', page:'Les 5 deel 3, p. 35-39', q:'Wie was <b>Philippos</b>?', opts:['de koning van Makedonië, die profiteerde van de verdeeldheid tussen de Griekse poleis','een Atheense strateeg','een Perzische koning','een Spartaanse heloot'], ok:0, hint:'Demosthenes waarschuwde ervoor: de koning uit het noorden.', uitleg:'Philippos was koning van Makedonië. Terwijl Athene en Sparta elkaar bestreden, bouwde hij een sterk leger uit en profiteerde hij van de verdeeldheid.'},
  f_falanx:{type:'mc', label:'De falanx', page:'Les 5 deel 3, p. 35-39', q:'Wat is een <b>falanx</b>?', opts:['een gesloten gevechtsformatie van soldaten die in rijen naast en achter elkaar vechten','een Grieks schip','een geneesoord','een soort munt'], ok:0, hint:'Denk aan de muur van speren die op je afkwam.', uitleg:'Een falanx is een gesloten gevechtsformatie. De Makedonische falanx had extra lange speren, zodat de vijand niet dichtbij kon komen.'},
  f_beroeps:{type:'mc', label:'Het beroepsleger', page:'Les 5 deel 3, p. 35-39', q:'Philippos had een <b>beroepsleger</b>. Wat betekent dat?', opts:['een leger van soldaten die oorlog voeren als beroep','een leger van boeren die na de oogst vechten','een leger zonder wapens','een vloot van handelsschepen'], ok:0, hint:'Oorlog voeren is hun job.', uitleg:'Een beroepsleger bestaat uit soldaten die oorlog voeren als beroep. Ze trainen het hele jaar.'},
  f_oorzgev:{type:'cat', label:'Oorzaken en gevolgen van het einde van de onafhankelijkheid', page:'Les 5 deel 3 (schema), p. 35-39', q:'Is elk element een <b>oorzaak</b> of een <b>gevolg</b> van de nederlaag?', bins:[{k:'O',n:'Oorzaak',c:'#009BA8'},{k:'G',n:'Gevolg',c:'#EE7D22'}], items:[['De Griekse poleis zijn politiek verdeeld','O'],['Onderlinge oorlogen verzwakken de poleis','O'],['Makedonië is een politieke eenheid met een sterk leger','O'],['De Griekse poleis zijn niet langer onafhankelijk','G'],['Er ontstaat een groot Makedonisch koninkrijk','G']], hint:'Bekijk het schema "het einde van de onafhankelijkheid" in je leerwerkboek.', uitleg:'Verdeelde, verzwakte poleis tegenover een verenigd Makedonië met militaire ambities. Gevolg: het einde van de onafhankelijkheid en een groot Makedonisch koninkrijk.'},
  f_einde:{type:'mc', label:'338 v.C.: Chaeronea', page:'Les 5 deel 3, p. 35-39', q:'Wanneer en waar verloren de Griekse poleis hun onafhankelijkheid?', opts:['in 338 v.C. bij Chaeronea','in 490 v.C. bij Marathon','in 480 v.C. bij Salamis','in 323 v.C. in Babylon'], ok:0, hint:'Je was er net bij.', uitleg:'In 338 v.C. versloeg Philippos de Griekse poleis bij Chaeronea. Vanaf dan maakten ze deel uit van het Makedonische koninkrijk.'},
  f_valex:{type:'mc', v:true, label:'V+ Alexander de Grote', page:'V+ Alexander de Grote (Classroom)', q:'Wie volgde Philippos op en veroverde daarna het Perzische rijk?', opts:['zijn zoon Alexander, later "de Grote" genoemd','Leonidas','Perikles','Darius'], ok:0, hint:'Hij werd zo bekend dat hij "de Grote" werd genoemd.', uitleg:'Alexander volgde zijn vader op en veroverde het Perzische rijk. Na zijn dood in 323 v.C. viel zijn rijk uiteen. Meer daarover in de V+ opdracht in Classroom.'}
};

let st = (() => { try { const s = JSON.parse(localStorage.getItem(KEY)); return s && s.log ? s : fresh(); } catch(e){ return fresh(); } })();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e){} }

  }
  /* pijlen */
  cx.strokeStyle = '#2a1d14'; cx.lineWidth = 1.6; for (const p of projs){ const a = Math.atan2(p.vy, p.vx); cx.beginPath(); cx.moveTo(p.x, p.y); cx.lineTo(p.x - Math.cos(a)*12, p.y - Math.sin(a)*12); cx.stroke(); }
  /* deeltjes */
  for (const p of parts){ const k = 1 - p.life/p.max; if (p.type === 'smoke'){ cx.fillStyle = p.c + (k*.35) + ')'; cx.beginPath(); cx.arc(p.x, p.y, p.s*(1.6 - k*.6), 0, 7); cx.fill(); } else { cx.globalAlpha = Math.max(0, k); cx.fillStyle = p.c; cx.fillRect(p.x - p.s/2, p.y - p.s/2, p.s, p.s); cx.globalAlpha = 1; } }
  /* markering */
  const mk = markerPos(); if (mk){ const b = Math.sin(time*4)*4; const isEnt = G.marker.look || G.marker.kind; const yy = mk.y - (isEnt ? 44 : 20) + b; cx.fillStyle = '#ffd24a'; cx.strokeStyle = '#6a4a00'; cx.lineWidth = 2; cx.beginPath(); cx.moveTo(mk.x, yy - 9); cx.lineTo(mk.x + 7, yy); cx.lineTo(mk.x, yy + 9); cx.lineTo(mk.x - 7, yy); cx.closePath(); cx.fill(); cx.stroke(); if (!isEnt){ cx.strokeStyle = 'rgba(255,210,74,.6)'; cx.beginPath(); cx.ellipse(mk.x, mk.y, 22 + b, 10 + b/2, 0, 0, 7); cx.stroke(); } }
  /* schermlagen */
  cx.setTransform(1,0,0,1,0,0);
  if (Z.tint === 'brand'){ cx.fillStyle = 'rgba(120,40,10,.18)'; cx.fillRect(0,0,VW,VH); }
  if (Z.tint === 'avond'){ cx.fillStyle = 'rgba(240,140,60,.12)'; cx.fillRect(0,0,VW,VH); }
  if (Z.tint === 'goud'){ cx.fillStyle = 'rgba(255,220,120,.07)'; cx.fillRect(0,0,VW,VH); }
  if (Z.tint === 'rook'){ cx.fillStyle = 'rgba(90,70,50,.14)'; cx.fillRect(0,0,VW,VH); }
  if (Z.tint === 'grijs'){ cx.globalCompositeOperation = 'saturation'; cx.fillStyle = 'rgba(128,128,128,.55)'; cx.fillRect(0,0,VW,VH); cx.globalCompositeOperation = 'source-over'; cx.fillStyle = 'rgba(40,50,60,.12)'; cx.fillRect(0,0,VW,VH); }
  cx.drawImage(vignette, 0, 0);
  if (P && P.hp/P.maxhp < .35 && !G.naval){ cx.fillStyle = `rgba(160,0,20,${.15 + Math.sin(time*5)*.08})`; cx.fillRect(0,0,VW,VH); }
  if (hurtFlash > 0){ cx.fillStyle = `rgba(200,0,20,${hurtFlash*.6})`; cx.fillRect(0,0,VW,VH); }
  if (G.mode === 'vp'){ cx.fillStyle = 'rgba(0,0,0,.25)'; cx.fillRect(0,0,VW,50); cx.fillRect(0,VH-50,VW,50); }
  /* pijl naar markering buiten beeld */
  if (mk && G.mode === 'play'){ const sxp = (mk.x - cam.x)*ZOOM, syp = (mk.y - cam.y)*ZOOM; if (sxp < 30 || syp < 30 || sxp > VW-30 || syp > VH-30){ const a = Math.atan2(syp - VH/2, sxp - VW/2); const ex = VW/2 + Math.cos(a)*(VW/2 - 40), ey = VH/2 + Math.sin(a)*(VH/2 - 40); cx.save(); cx.translate(clamp(ex, 30, VW-30), clamp(ey, 70, VH-30)); cx.rotate(a); cx.fillStyle = '#ffd24a'; cx.strokeStyle = '#6a4a00'; cx.lineWidth = 2; cx.beginPath(); cx.moveTo(16, 0); cx.lineTo(-8, 11); cx.lineTo(-3, 0); cx.lineTo(-8, -11); cx.closePath(); cx.fill(); cx.stroke(); cx.restore(); } }
}

/* ---------- lus ---------- */
let last = performance.now();
function loop(now){
  const dt = Math.min(.05, (now - last)/1000); last = now; time += dt;
  if (Z && P){
    ZOOM = lerp(ZOOM, zoomTarget, .06);
    if (G.mode === 'play'){
      st.playT = (st.playT||0) + dt;
      if (G.naval) updateNaval(dt);
      else {
        if (!P.dead) updatePlayer(dt);
        for (const e of ents){ if (e === P) continue; e.cd = Math.max(0, e.cd - dt); updateAI(e, dt); }
        /* uit elkaar duwen */
        for (let i=0;i<ents.length;i++){ const a = ents[i]; if (a.dead) continue; for (let j=i+1;j<ents.length;j++){ const b = ents[j]; if (b.dead) continue; const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), m = (a.r + b.r)*.85; if (d > 0 && d < m){ const push = (m - d)/2, ux = dx/d, uy = dy/d; if (a !== P || !b.follow) moveEnt(a, -ux*push, -uy*push); moveEnt(b, ux*push, uy*push); } } }
        updateProjs(dt); updateBattle(dt);
        const s = STEPS[st.step]; if (s && s.update && !G.advancing) s.update.call(s, dt);
        battleDrums(dt, G.battle);
      }
      for (const e of ents){ e.flash = Math.max(0, (e.flash||0) - dt); e.atkT = Math.max(0, (e.atkT||0) - dt); e.invul = Math.max(0, (e.invul||0) - dt); }
      P.cd = Math.max(0, P.cd - dt);
      if (Math.random() < .2) revealAround(P.x, P.y, G.naval ? 16 : 10);
      if (Z.tint === 'brand' && Math.random() < dt*4) puff(cam.x + rnd(0, VW/ZOOM), cam.y + VH/ZOOM, 'ember', 1);
    }
    if (G.mode === 'vp' && G.vpAnim){ G.vpAnim.t += dt; }
    for (const p of parts){ p.life += dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += (p.g||0)*dt; p.vx *= .97; }
    parts = parts.filter(p => p.life < p.max);
    for (const d of decals) if (d.a > .3 && d.arrow === undefined) d.a -= dt*.01;
    shake = Math.max(0, shake - dt*30); hurtFlash = Math.max(0, hurtFlash - dt);
    render(); updateHUD();
  }
  for (const k in pressed) delete pressed[k];
  requestAnimationFrame(loop);
}

/* ---------- start ---------- */
function showStart(){
  const busy = st.naam && (st.step > 0 || Object.keys(st.log).length);
  const box = $('#start'); box.querySelector('.sbody').innerHTML = `<div class="logo2">POLIS</div><div class="sub2">Schaduw van Hellas</div>
    <p>Beleef zes herinneringen uit het oude Griekenland: de democratie van Athene, de strenge stad Sparta, de Perzische Oorlogen en de dag dat de Griekse poleis hun vrijheid verloren. Je loopt vrij rond, je vecht, je sluipt en je vaart. Elke vraag verwijst naar je leerwerkboek (Les 4 en 5).</p>
    <div class="sporen"><span class="sp sp-b">Basis</span> alle hoofdmissies <span class="sp sp-r">Hulp</span> tips van Glaux met paginaverwijzing <span class="sp sp-v">V+</span> zijpaden voor wie meer wil</div>
    <p class="small">Speelduur ongeveer 50 minuten. Je voortgang wordt automatisch bewaard, je kan dus ook over twee lessen spelen. Zet je geluid aan!</p>
    <div class="form"><label>Voornaam en naam<input id="fnaam" maxlength="40" value="${esc(st.naam||'')}" placeholder="bv. Lotte Peeters"></label><label>Klas<select id="fklas">${['','2Ag','2Ah','2Ai','andere'].map(k => `<option ${st.klas===k?'selected':''} value="${k}">${k||'kies je klas'}</option>`).join('')}</select></label></div>
    <div class="qrow">${busy ? `<button class="btn" id="sCont">Verder spelen: ${ACTS[st.act||0].kop} ${ICO.arrow}</button>` : ''}<button class="btn ${busy?'alt':''}" id="sNew">${busy ? 'Opnieuw beginnen' : 'Start'} ${busy?'':ICO.arrow}</button></div><div id="sfb"></div>`;
  box.classList.add('open');
  $('#sNew').onclick = () => { const n = $('#fnaam').value.trim(), k = $('#fklas').value; if (n.length < 3 || !k){ $('#sfb').className = 'fb no'; $('#sfb').textContent = 'Vul je naam en klas in, zodat je leerkracht weet van wie het verslag is.'; return; }
    if (busy && !confirm('Wil je echt opnieuw beginnen? Je score en voortgang worden gewist.')) return; st = fresh(); st.naam = n; st.klas = k; save(); begin(); };
  if (busy) $('#sCont').onclick = () => begin(true);
}
function begin(resume){ ac(); $('#start').classList.remove('open'); $('#hud').classList.add('on'); G.mode = 'play'; Z = null; startStep(st.step || 0, false); }

function init(){
  makeVignette(); initTouch();
  $('#jBtn').onclick = () => openJournal(); $('#jClose').onclick = closeJournal;
  $('#sBtn').onclick = () => { muted = !muted; $('#sBtn').innerHTML = muted ? ICO.mute : ICO.sound; }; $('#sBtn').innerHTML = ICO.sound;
  $('#mBtn').onclick = () => { if (confirm('Terug naar het startscherm? Je voortgang blijft bewaard.')){ G.mode = 'start'; ['#dlg','#quiz','#cut','#journal','#end','#desync'].forEach(s => $(s).classList.remove('open')); $('#hud').classList.remove('on'); showStart(); } };
  addEventListener('keydown', e => {
    if (e.code === 'Tab'){ e.preventDefault(); if ($('#journal').classList.contains('open')) closeJournal(); else if (G.mode === 'play') openJournal(); }
    if (e.code === 'Escape' && $('#journal').classList.contains('open')) closeJournal();
    if ((e.code === 'KeyE' || e.code === 'Enter') && $('#dlg').classList.contains('open') && dlgQueue && !e.repeat){ e.preventDefault(); delete pressed[e.code]; dlgQueue.adv(); setTimeout(() => { delete pressed.KeyE; }, 0); }
    if ((e.code === 'Enter') && $('#cut').classList.contains('open') && !e.repeat){ const b = $('#cnext'); if (b) b.click(); }
  });
  showStart(); requestAnimationFrame(loop);
}
window.addEventListener('DOMContentLoaded', init);

document.getElementById('drico').innerHTML = ICO.coin;
</script>
